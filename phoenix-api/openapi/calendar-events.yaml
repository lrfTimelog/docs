        as_of:
          type: string
          format: date-time
          description: Server time of the read (APG-610).
    Tombstone:
      type: object
      description: Minimal body of a deleted record returned by `GET /{id}` during the retention window (P5 §3); `404` after
        it. Retention floor ≥ 90 days is published only once backed (FP-4 (b), ED-007).
      required:
      - id
      - deleted_at
      - updated_at
      properties:
        id:
          type: string
        deleted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
      x-open-decision:
      - ED-007
      - ED-037
    Problem:
      type: object
      description: The one error shape for every status ≥ 400 (`application/problem+json`, RFC 9457 + `code`). Switch on `code`;
        an unknown `code` falls back to the class of `status`. Unknown fields must be tolerated.
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      - retryable
      properties:
        type:
          type: string
          format: uri-reference
          description: URI of the code's documentation page (one per `code`). Documentation host is open.
          x-open-decision:
          - ED-013
          - ED-006
        title:
          type: string
          description: Short stable summary of the code.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable machine token. Open catalogue (new codes may be added within /v1).
        detail:
          type: string
          description: Request-specific, remedy-first English sentence. Never internal names or TLP error numbers.
        request_id:
          type: string
          description: Same value as the `Request-Id` header.
        retryable:
          type: boolean
          description: '`true` only when the same request may succeed later unchanged (writes: same `Idempotency-Key`).'
        errors:
          type: array
          description: Field-level problems (400 / 422 only), all returned together (P6 §4).
          items:
            $ref: '#/components/schemas/FieldError'
        context:
          type: object
          description: Typed object whose schema is fixed per `code` (see the `*Context` schemas).
          additionalProperties: true
    FieldError:
      type: object
      required:
      - pointer
      - code
      - message
      properties:
        pointer:
          type: string
          description: JSON Pointer into the body, or `query:<param>`, or `header:<name>`.
        code:
          type: string
          description: Field-level code.
          x-extensible-enum:
          - required
          - invalid_format
          - out_of_range
          - unknown_reference
          - read_only
          - create_only
          - too_long
          - not_allowed_value
        message:
          type: string
        constraint:
          type: object
          additionalProperties: true
    Warning:
      type: object
      description: Non-fatal outcome on a `2xx` (P8). Same catalogue rules as error codes.
      required:
      - code
      - detail
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        detail:
          type: string
        context:
          type: object
          additionalProperties: true
