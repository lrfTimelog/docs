        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              properties:
                context:
                  $ref: '#/components/schemas/RuleViolationContext'
          examples:
            employee_mismatch:
              value:
                type: /errors/rule_violation
                title: Rule violation
                status: 422
                code: rule_violation
                detail: The calendar event belongs to another employee. Register it for the event's attendee.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0RE14
                retryable: false
                context:
                  rule: calendar_event_employee_mismatch
            validation_failed:
              value:
                type: /errors/validation_failed
                title: Validation failed
                status: 422
                code: validation_failed
                detail: Two fields are invalid. Correct them and send the request again.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0RE15
                retryable: false
                errors:
                - pointer: /hours
                  code: out_of_range
                  message: Hours must be greater than 0.
                  constraint:
                    exclusive_minimum: 0
                - pointer: /calendar_event/id
                  code: unknown_reference
                  message: No calendar event with this id is visible to this credential.
    TimeRegistrationUnavailable:
      description: 'Time registration is temporarily unavailable (`dependency_unavailable`, `capability: time_registration`)
