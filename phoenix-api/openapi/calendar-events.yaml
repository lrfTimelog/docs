  /v1/bookings/by-day:
    put:
      operationId: setBookingShareByDay
      tags:
      - Bookings
      summary: Set your source's share of one day
      description: 'Use to state how many hours your source has booked for an employee on a task on one day. Sets only the
        share of `source`; the planner''s share and other sources'' shares are never touched. `hours` is the desired total
        for your source on that day (not a delta); `hours: 0` zeroes your share, which stays readable. There is no DELETE.
        A multi-day event is one call per day. The employee must already be allocated to the task: otherwise `409 allocation_required`
        (no allocation is created, PD-063). The source `timelog` is reserved. Idempotent by construction (`Idempotency-Key`
        optional); the response echoes the accepted share so no follow-up read is needed.'
      x-requirements:
      - CAP-362
      - SC-50
      x-effects:
        effect: write
        idempotent: true
        idempotency: key_optional
      security:
      - bearerAuth:
        - planning:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingShareSet'
            examples:
              set_share:
                summary: CADAC books 1.5 h on 3 September
                value:
                  employee:
                    id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
                  task:
                    id: tsk_01JB7Q4ZK3M8T5V2W9X6Y0TSK1
                  date: '2026-09-03'
                  source: cadac
                  hours: 1.5
              zero_share:
                summary: The meeting was cancelled - zero the share
                value:
                  employee:
                    id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
                  task:
                    id: tsk_01JB7Q4ZK3M8T5V2W9X6Y0TSK1
                  date: '2026-09-03'
                  source: cadac
                  hours: 0
      responses:
        '200':
          description: The share existed and now has the requested hours (also when unchanged).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            Request-Id:
              $ref: '#/components/headers/Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                updated:
                  $ref: '#/components/examples/CadacShare'
        '201':
          description: First share of this source at this coordinate.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            Request-Id:
              $ref: '#/components/headers/Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                created:
                  $ref: '#/components/examples/CadacShare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
