    EventEnvelope:
      type: object
      description: Thin event envelope. No `sequence` (FP-5 (4)); `api_version` is always `null`. Delivered at least once,
        after commit, unordered; dedupe on `id` and `GET` the object for current state. Unknown types and fields must be ignored.
        `related[]` entries the subscriber cannot read are removed (P10 §5). `snapshot` only when the subscription opted in
        (`include_snapshot`).
      required:
      - id
      - type
      - occurred_at
      - api_version
      - tenant_id
      - object
      - related
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
          examples:
          - time_entry.created
        occurred_at:
          type: string
          format: date-time
        api_version:
          type: 'null'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        object:
          $ref: '#/components/schemas/TypedRef'
        related:
          type: array
          items:
            $ref: '#/components/schemas/TypedRef'
        snapshot:
          type: object
          additionalProperties: true
      examples:
      - id: evt_01JB7Q4ZK3M8T5V2W9X6Y0EVT1
        type: time_entry.created
        occurred_at: '2026-09-03T10:05:12Z'
        api_version: null
        tenant_id: ten_01JB7Q4ZK3M8T5V2W9X6Y0TEN1
        object:
          type: time_entry
          id: te_01JB7Q4ZK3M8T5V2W9X6Y0TE01
        related:
        - type: employee
          id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
        - type: calendar_event
          id: cev_01JB7Q4ZK3M8T5V2W9X6Y0CEV1
    XEffects:
      type: object
      required:
      - effect
      - idempotent
      properties:
        effect:
          type: string
          enum:
          - read
          - write
          - destructive
        idempotent:
          type: boolean
        idempotency:
          type: string
          enum:
          - natural
          - key_required
          - key_optional
      additionalProperties: false
  headers:
    Request-Id:
      description: Unique id of this request. Same value as `request_id` in a problem body (P8). Quote it to support.
      schema:
        type: string
        maxLength: 64
      example: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ1
    RateLimit-Limit:
      description: Requests allowed in the current window of the bucket this request consumed (P9 §1). Numbers are published
        per caller type (PD-053 uniform at v1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    RateLimit-Remaining:
      description: Requests left in the current window of the consumed bucket (P9 §1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    RateLimit-Reset:
      description: Seconds until the consumed bucket's window resets (P9 §1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    Retry-After:
      description: Seconds to wait before retrying (`429`, and `503` when known) (P8 classes 9-11, P9).
      schema:
        type: integer
        minimum: 0
    ETag:
      description: Entity tag of the returned resource; changes whenever `updated_at` changes (P5 §5). Send it back in `If-Match`
        to write only if nothing changed (P6 §3). The backing signal per resource is ED-038.
      schema:
        type: string
      x-open-decision:
      - ED-038
    Location:
      description: URL of the created resource (`201`).
      schema:
        type: string
        format: uri-reference
    Idempotent-Replayed:
      description: '`true` when this response is the stored outcome of an earlier request with the same `Idempotency-Key`
        and body (P6 §1). Nothing was created or emitted.'
      schema:
        type: boolean
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, maximum 100 (P4 §1 starting values). Above the maximum is `400 malformed_request`,
        never silently clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `meta.next_cursor` from the previous page (P4 §1). Send it with no other parameter changed, or the
        response is `400 invalid_cursor`. Cursor lifetime is a published service window (PD-052); an expired cursor is `400
        invalid_cursor`.
      schema:
        type: string
        maxLength: 2048
      x-open-decision:
      - PD-052
      - ED-011
    Fields:
      name: fields
      in: query
      required: false
      description: Comma-separated top-level fields to return (`id` always included); dotted paths select inside an expanded
        reference (P4 §4).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)?$
        maxItems: 50
    IdFilter:
      name: id
      in: query
      required: false
      description: Only these ids (`in`, comma-separated, max 100) (P4 §2 global set).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
    CreatedAfter:
      name: created_after
      in: query
      required: false
      description: Only rows created strictly after this instant (P4 §2 global set).
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      required: false
      description: Only rows created at or before this instant (P4 §2 global set).
      schema:
        type: string
        format: date-time
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      description: '`true` adds soft-deleted rows (tombstones) within the retention window (FP-4, P5 §3). Resources whose
        delete strategy is snapshot-only return no tombstones; their reference page says so.'
      schema:
        type: boolean
        default: false
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated key (≤ 255 chars, UUID recommended) making this write safe to retry (P6 §1). Required
        here because a duplicate costs money, pay or approval. Same key + same body → original outcome replayed with `Idempotent-Replayed:
        true`; same key + different body → `409 idempotency_key_reused`; still in flight → `409 idempotency_request_in_progress`.
        Missing → `400 validation_failed` (`pointer: header:Idempotency-Key`). Key retention is a published service window
        with a floor of 24 h (PD-052).'
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 6f1c2b9e-3a47-4d0c-9a51-2f8e7d1c4b10
      x-open-decision:
      - PD-052
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional, recommended on retries (P6 §1). Same replay semantics as where it is required. Retention per
        PD-052.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 0b8d4f3a-91e2-4c67-8f1d-5a2c3e9b7d64
      x-open-decision:
      - PD-052
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Write only if the resource's current `ETag` equals this value; otherwise `412 precondition_failed` and
        nothing is written (P6 §3). Optional; omitting it is last-write-wins.
      schema:
        type: string
    DryRun:
      name: dry_run
      in: query
      required: false
      description: '`true` runs the same authorization, validation and business rules and returns what the real call would
        return (status, body with a placeholder id, `warnings[]`, or the same error) with no side effects: nothing stored,
        no events, no id reserved, no idempotency record (P6 §5).'
      schema:
        type: boolean
        default: false
    Q:
      name: q
      in: query
      required: false
      description: 'Free-text search over the resource''s declared search fields (its reference page lists them), case- and
        accent-insensitive, minimum 2 characters (P4 §6). Deterministic ranking: exact business-key match (number, external
        key, email) first, then name prefix, then contained term; ties by `id`. `sort` is ignored when `q` is present. Search
        obeys row scope. If an index serves it, `meta.as_of` reflects the index''s freshness.'
      schema:
        type: string
        minLength: 2
        maxLength: 200
      x-open-decision:
      - ED-040
