  /v1/time-entries:
    post:
      operationId: createTimeEntry
      tags:
      - Time entries
      summary: Register time (optionally from a calendar event)
      description: 'Use to register hours an employee worked on a task. To register a calendar event, send its id in `calendar_event`;
        `date`, `hours` and `task` are always yours - TimeLog does not derive them from the event (guidance: `date` = local
        date of `start_at` in the employee''s time zone). At most one non-deleted time entry may reference an event: a second
        one is `409 duplicate` with `matched_on: calendar_event`. Later event changes never change the entry; deleting the
        event leaves the entry and its reference; deleting the entry frees the event (PD-057). Runs every rule the TimeLog
        UI runs. If no allocation exists for (employee, task), one is created and returned, with warning `allocation_created`
        (PD-025). `Idempotency-Key` is required. `?dry_run=true` previews the outcome.'
      x-requirements:
      - CAP-203
      - CAP-207
      - CAP-217
      - SC-44
      - SC-50
      x-effects:
        effect: write
        idempotent: true
        idempotency: key_required
      security:
      - bearerAuth:
        - time:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryCreate'
            examples:
              from_calendar_event:
                summary: Register a calendar event as one hour of project time
                value:
                  employee:
                    id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
                  task:
                    id: tsk_01JB7Q4ZK3M8T5V2W9X6Y0TSK1
                  date: '2026-09-03'
                  hours: 1.0
