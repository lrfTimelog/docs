components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer credential of a service account bound to an `api_user` employee (D-007) or a personal access token
        (P2 §A). The tenant comes from the credential only. Effective permission = scope ∩ privilege ∩ licence ∩ row scope
        (P2 §B). Security requirements list the required `<family>:<access>` scopes as role names (OpenAPI 3.1 §4.8.30). Token
        mechanism: service accounts ED-019, PATs on the public host ED-004.'
      x-open-decision:
      - ED-019
      - ED-004
      x-scopes:
        time:read: Read time entries, timesheets and calendar events.
        time:write: Create and change time entries.
        planning:read: Read allocations, bookings and capacity views.
        planning:write: Set booking shares and change allocations.
        costs:read: Sensitive (PD-012). Cost and revenue fields; omitted from bodies when absent.
        customers:read: Read customers, their status labels and (when shipped) contacts.
        customers:write: Create, change, merge-mark and delete customers.
        projects:read: Read projects, project templates and project reference lists (types, categories, stages).
        projects:write: Create projects (blank or from a template), change them, move them through their lifecycle and delete
          them.
  responses:
    TimeEntryConflict:
      description: 'The write conflicts with the current state of TimeLog data. `duplicate` (`matched_on`: `calendar_event`
        when the event is already registered, `external_id`, `idempotency`), `idempotency_key_reused`, `idempotency_request_in_progress`
        (retryable), `period_locked` (date in a closed period), `resource_immutable` (update of a locked entry via `PUT ext:`),
        `registration_target_unavailable` (the task, project or allocation does not accept time; same reasons as the registration-targets
        view), `allocated_hours_exceeded` (tenant blocks time beyond allocated hours).'
      x-error-codes:
      - duplicate
      - idempotency_key_reused
      - idempotency_request_in_progress
      - period_locked
      - resource_immutable
      - registration_target_unavailable
      - allocated_hours_exceeded
      x-context-by-code:
        duplicate: ../_shared/components.yaml#/components/schemas/DuplicateContext
        period_locked: ../_shared/components.yaml#/components/schemas/PeriodLockedContext
        resource_immutable: ../_shared/components.yaml#/components/schemas/ResourceImmutableContext
        registration_target_unavailable: '#/components/schemas/RegistrationTargetUnavailableContext'
        allocated_hours_exceeded: '#/components/schemas/AllocatedHoursExceededContext'
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              properties:
                context:
                  anyOf:
                  - $ref: '#/components/schemas/DuplicateContext'
                  - $ref: '#/components/schemas/PeriodLockedContext'
                  - $ref: '#/components/schemas/ResourceImmutableContext'
                  - $ref: '#/components/schemas/RegistrationTargetUnavailableContext'
                  - $ref: '#/components/schemas/AllocatedHoursExceededContext'
          examples:
            calendar_event_already_registered:
              value:
                type: /errors/duplicate
                title: Duplicate
                status: 409
                code: duplicate
                detail: This calendar event is already registered as time entry te_01JB7Q4ZK3M8T5V2W9X6Y0TE01. Update that
                  entry instead, or delete it to register the event again.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0RE11
                retryable: false
                context:
                  matched_on: calendar_event
                  conflicting_resource:
                    type: time_entry
                    id: te_01JB7Q4ZK3M8T5V2W9X6Y0TE01
            period_locked:
              value:
                type: /errors/period_locked
                title: Period locked
                status: 409
                code: period_locked
                detail: Time cannot be registered on 2026-08-29; the period is locked for registration. Register in an open
                  period or ask a finance user to reopen it.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0RE12
                retryable: false
                context:
                  lock_kind: registration
                  period:
                    start: '2026-08-01'
                    end: '2026-08-31'
            registration_target_unavailable:
              value:
                type: /errors/registration_target_unavailable
                title: Registration target unavailable
                status: 409
                code: registration_target_unavailable
                detail: The task does not accept time because it is not in progress. Choose an active task.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0RE13
                retryable: false
                context:
                  target:
                    type: task
                    id: tsk_01JB7Q4ZK3M8T5V2W9X6Y0TSK2
                  reason: task_not_in_progress
    TimeEntryUnprocessable:
      description: 'The request is invalid whatever the state. `validation_failed` with all field problems in `errors[]` (`required`,
        e.g. `comment` where the tenant requires comments; `out_of_range` on `hours`; `create_only` on `employee` / `calendar_event`
        in an update; `read_only`; `unknown_reference` for an id that does not exist or is not visible). `rule_violation`
        with `rule: calendar_event_employee_mismatch` when the event belongs to another employee than the entry.'
      x-error-codes:
      - validation_failed
      - rule_violation
      x-context-by-code:
        rule_violation: ../_shared/components.yaml#/components/schemas/RuleViolationContext
      headers:
