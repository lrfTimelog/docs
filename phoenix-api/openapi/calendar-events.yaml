  /v1/bookings:
    get:
      operationId: listBookings
      tags:
      - Bookings
      summary: List booking shares in a date window
      description: 'Use to read who is booked on what, per day and per source, in a date window (`date_from` and `date_to`
        are required, inclusive; the maximum window is a published number, PD-052). Each row is one source''s share of (employee,
        task, date). Shares your source zeroed (`hours: 0`) stay visible for a published window. Shares removed inside TimeLog
        (planner, recurring plans) simply disappear: there is no `updated_after` and no booking event yet (APG-616), so re-read
        the window to detect planner changes (snapshot-only delete strategy). Filter `source=<your namespace>` to read back
        your own shares.'
      x-requirements:
      - CAP-361
      - CAP-363
      - SC-50
      x-effects:
        effect: read
        idempotent: true
        idempotency: natural
      x-incremental-sync: false
      security:
      - bearerAuth:
        - planning:read
      parameters:
      - name: date_from
        in: query
        required: true
        description: First business date of the window (inclusive).
        schema:
          type: string
          format: date
        example: '2026-09-01'
      - name: date_to
        in: query
        required: true
        description: Last business date of the window (inclusive). Window length ≤ the published maximum (PD-052); above it
          `400 malformed_request`.
        schema:
          type: string
          format: date
        example: '2026-09-30'
        x-open-decision:
        - PD-052
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/IdFilter'
      - $ref: '#/components/parameters/CreatedAfter'
      - $ref: '#/components/parameters/CreatedBefore'
      - name: employee
        in: query
        description: Only shares of these employees (`in`, `emp_` ids).
        style: form
        explode: false
        schema:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EmployeeId'
      - name: task
        in: query
        description: Only shares on these tasks (`in`, `tsk_` ids).
        style: form
        explode: false
        schema:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskId'
      - name: allocation
        in: query
        description: Only shares hanging off these allocations (`in`, `alc_` ids).
        style: form
        explode: false
        schema:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AllocationId'
      - name: project
        in: query
