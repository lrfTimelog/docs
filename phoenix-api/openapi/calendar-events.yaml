  /v1/bookings/{id}:
    get:
      operationId: getBooking
      tags:
      - Bookings
      summary: Get one booking share
      description: Use to resolve a `bkg_` id to one source's share of (employee, task, date). The id is read-only and stable
        per (employee, task, date, source) (ED-036). A zeroed share resolves during the published zeroed-share window (PD-052);
        after it, and for shares removed inside TimeLog, `404`.
      x-requirements:
