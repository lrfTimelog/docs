  /v1/time-entries/ext:{ns}:{key}:
    put:
      operationId: upsertTimeEntryByExternalId
      tags:
      - Time entries
      summary: Create or update a time entry by your own key
      description: 'Use when your system keys time on its own id (a Google Calendar event id, a worklog id): creates the entry
        if no entry holds `{ns}:{key}`, otherwise updates it (FP-6). Idempotent without a key. On update, `date`, `hours`,
        `task`, `billable`, `billable_hours` and `comment` may change; `employee` and `calendar_event` are create-only (`422
        validation_failed`, field code `create_only`). A locked entry (closed timesheet, invoiced, closed period) is never
        silently overwritten: `409 resource_immutable`.'
      x-requirements:
      - CAP-206
      - SC-50
      x-effects:
        effect: write
        idempotent: true
        idempotency: natural
      security:
      - bearerAuth:
        - time:write
      parameters:
      - name: ns
        in: path
        required: true
        description: Your namespace token (`[a-z0-9-]`, 1-32 chars, stable once used).
        schema:
          $ref: '#/components/schemas/NamespaceToken'
        example: gcal
      - name: key
        in: path
        required: true
        description: Your key within the namespace (URL-encoded).
        schema:
          type: string
          minLength: 1
          maxLength: 255
        example: 7k2m9q4r1t8v0x3z5b6d
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryUpsert'
            examples:
              gcal_event:
                summary: A Google Calendar event registered under the add-on's own key
                value:
                  employee:
                    id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
                  task:
                    id: tsk_01JB7Q4ZK3M8T5V2W9X6Y0TSK1
                  date: '2026-09-04'
                  hours: 0.5
                  comment: Customer check-in
      responses:
        '200':
          description: Updated the entry that holds the key.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Request-Id:
              $ref: '#/components/headers/Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryWriteResult'
              examples:
                updated:
                  $ref: '#/components/examples/GcalTimeEntry'
        '201':
          description: Created a new entry holding the key.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Request-Id:
              $ref: '#/components/headers/Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryWriteResult'
              examples:
                created:
                  $ref: '#/components/examples/GcalTimeEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
