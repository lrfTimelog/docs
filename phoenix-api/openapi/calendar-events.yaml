                detail: The cursor is expired or was combined with changed parameters. Restart the listing without a cursor.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ3
                retryable: false
    Unauthenticated:
      description: No valid credential (P8 class 1). Never says whether a credential exists. Re-mint or refresh; do not retry
        unchanged.
      x-error-codes:
      - unauthenticated
      - token_expired
      - token_revoked
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /errors/unauthenticated
            title: Authentication required
            status: 401
            code: unauthenticated
            detail: Send a valid bearer credential in the Authorization header.
            request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ4
            retryable: false
    Forbidden:
      description: 'The credential may not perform this operation (P8 class 2): `missing_scope` (context `required_scopes`),
        `insufficient_privilege`, `licence_required` / `feature_disabled` (context `module`). A record outside the caller''s
        row scope is `404`, never `403`.'
      x-error-codes:
      - missing_scope
      - insufficient_privilege
      - licence_required
      - feature_disabled
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing_scope:
              value:
                type: /errors/missing_scope
                title: Missing scope
                status: 403
                code: missing_scope
                detail: This credential lacks the scope 'time:read'. Ask a tenant admin to add it to the credential.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ5
                retryable: false
                context:
                  required_scopes:
                  - time:read
    NotFound:
      description: No such resource, or it exists outside the caller's row scope or tenant; the two are byte-identical (P8
        class 3, row-scope rule). A wrong id prefix is also `404` (P3 §2).
      x-error-codes:
      - not_found
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /errors/not_found
            title: Not found
            status: 404
            code: not_found
            detail: No calendar event with this id is visible to this credential.
            request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ6
            retryable: false
            context:
              resource_type: calendar_event
              id: cev_01JB7Q4ZK3M8T5V2W9X6Y0CEV9
    PreconditionFailed:
      description: '`If-Match` did not match the current `ETag`; nothing was written (P8 class 5). Re-read, re-apply, retry
        with the new value.'
      x-error-codes:
      - precondition_failed
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /errors/precondition_failed
            title: Precondition failed
            status: 412
            code: precondition_failed
            detail: The resource changed since you read it. Read it again and re-apply your change.
            request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ7
            retryable: false
            context:
              current_etag: '"b3a1f0"'
    RateLimited:
      description: 'A rate limit or quota was exceeded (P8 class 9, P9). Wait `Retry-After`; `retryable: true`.'
      x-error-codes:
      - rate_limited
      - quota_exceeded
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /errors/rate_limited
            title: Rate limited
            status: 429
            code: rate_limited
            detail: This credential exceeded its request rate. Retry after 12 seconds.
            request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ8
            retryable: true
            context:
              limit_scope: credential
              retry_after_seconds: 12
    InternalError:
      description: Transient server error (P8 class 11). `retryable` states whether the same request may be retried; writes
        retry only with the same `Idempotency-Key`. `context.outcome` is `not_applied` or `unknown` on writes.
      x-error-codes:
      - internal_error
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /errors/internal_error
            title: Internal error
            status: 500
            code: internal_error
            detail: An unexpected error occurred. Retry with the same Idempotency-Key; quote the request id if it persists.
            request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ9
            retryable: true
            context:
              outcome: unknown
    ServiceUnavailable:
      description: 'A dependency or the service is unavailable (P8 classes 10-11): `dependency_unavailable` (context `capability`,
        a public capability name, and `outcome`), `service_unavailable`. Retry after `Retry-After`; writes with `outcome:
        unknown` retry with the same `Idempotency-Key`.'
      x-error-codes:
      - dependency_unavailable
      - service_unavailable
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /errors/service_unavailable
            title: Service unavailable
            status: 503
            code: service_unavailable
            detail: The service is temporarily overloaded. Retry after 30 seconds.
            request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0RE10
            retryable: true
  examples:
    GcalTimeEntry:
      summary: A time entry keyed by the add-on's own id
      value:
        id: te_01JB7Q4ZK3M8T5V2W9X6Y0TE02
        employee:
          id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
        date: '2026-09-04'
        hours: 0.5
        task:
          id: tsk_01JB7Q4ZK3M8T5V2W9X6Y0TSK1
        project:
          id: prj_01JB7Q4ZK3M8T5V2W9X6Y0PRJ1
        allocation:
          id: alc_01JB7Q4ZK3M8T5V2W9X6Y0AC01
        legal_entity:
          id: lgl_01JB7Q4ZK3M8T5V2W9X6Y0GE01
        billable: true
        billable_hours: 0.5
        comment: Customer check-in
        approval_status: not_submitted
        approval_stage: null
        locked: false
        lock_reasons: []
        invoice_status: not_invoiced
        invoice: null
        calendar_event: null
        external_id:
          gcal: 7k2m9q4r1t8v0x3z5b6d
        created_at: '2026-09-04T15:30:00Z'
        updated_at: '2026-09-04T15:30:00Z'
        deleted_at: null
        warnings: []
    CadacShare:
      summary: The CADAC sync's share on 3 September
      value:
        id: bkg_01JB7Q4ZK3M8T5V2W9X6Y0BKG2
        employee:
          id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
        task:
          id: tsk_01JB7Q4ZK3M8T5V2W9X6Y0TSK1
        allocation:
          id: alc_01JB7Q4ZK3M8T5V2W9X6Y0AC01
        project:
          id: prj_01JB7Q4ZK3M8T5V2W9X6Y0PRJ1
        date: '2026-09-03'
        hours: 1.5
        source: cadac
        calendar_event: null
        created_at: '2026-09-01T06:00:03Z'
        updated_at: '2026-09-02T06:00:04Z'
  schemas:
    CalendarEvent:
      type: object
      description: One attendee's occurrence of an Outlook calendar event as TimeLog holds it (one `cev_` per attendee and
        occurrence). Read-only; Outlook owns it. No history (current values only, PD-041).
      required:
      - id
      - employee
      - start_at
      - end_at
      - time_zone
      - ical_uid
      - title
      - classification
      - content_redacted
      - time_entry
      - source
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/CalendarEventId'
        employee:
          $ref: '#/components/schemas/EmployeeRef'
          description: The attendee whose calendar this is.
        start_at:
          type: string
          format: date-time
          description: Start, RFC 3339 with the event's own UTC offset at that instant (DST-correct per occurrence). Never
            offset-less.
        end_at:
          type: string
          format: date-time
          description: End, RFC 3339 with the event's own UTC offset.
        time_zone:
          type:
          - string
          - 'null'
          description: 'IANA time zone of the event (`Europe/Copenhagen`). Windows zone ids are converted and never exposed;
            an unmappable zone gives `null` while `start_at` / `end_at` stay exact. All-day events: representation pending
            (APG-224).'
          x-open-decision:
          - APG-224
        ical_uid:
          type: string
          description: iCal UID, the cross-attendee join key. Not unique per row (one event per attendee).
        title:
          type:
          - string
          - 'null'
          description: 'Subject. `null` when `content_redacted` is `true`: a private or confidential event of another employee
            shows times only (PD-058 (a)).'
        classification:
          type: string
          description: Sensitivity. Open enum (FP-1); treat an unknown value as `private`.
          x-extensible-enum:
          - public
          - private
          - confidential
        content_redacted:
          type: boolean
          description: '`true` when the caller is not the attendee and the event is `private` or `confidential`: content fields
            are withheld, times and registration state are kept (PD-058 (a)).'
        time_entry:
          description: The non-deleted time entry registered from this event, or `null` (PD-039). Freed when the entry is
            deleted (PD-057).
          oneOf:
          - $ref: '#/components/schemas/TimeEntryRef'
          - type: 'null'
        source:
          type: string
          description: Where the event comes from. Open enum; `outlook` in v1. Treat an unknown value as an external calendar.
          x-extensible-enum:
          - outlook
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: 'null'
          description: Always `null` on a live event. A deleted event is returned as a `Tombstone` (P5 §3), never as a full
            body.
    CalendarEventCompact:
      type: object
      description: Default list projection (P4 §4). `fields=` selects any field of `CalendarEvent`.
      required:
      - id
      - employee
      - start_at
      - end_at
      - time_zone
      - title
      - content_redacted
      - time_entry
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/CalendarEventId'
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        time_zone:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        content_redacted:
          type: boolean
        time_entry:
          oneOf:
          - $ref: '#/components/schemas/TimeEntryRef'
          - type: 'null'
        updated_at:
          type: string
          format: date-time
    CalendarEventList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEventCompact'
        meta:
          $ref: '#/components/schemas/ListMeta'
    TimeEntryCreate:
      type: object
      description: Body of `POST /v1/time-entries`.
      required:
      - employee
      - task
      - date
      - hours
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeRef'
          description: Whose time. Create-only. Registering for someone else needs the register-for-others privilege.
        task:
          $ref: '#/components/schemas/TaskRef'
        date:
          type: string
          format: date
          description: Business date of the work (no time of day). For a calendar event, the local date of `start_at` in the
            employee's zone.
        hours:
          type: number
          exclusiveMinimum: 0
          description: Hours worked. Must be > 0; the upper bound is the engine's.
        billable:
          type: boolean
          description: Requested billable flag. TimeLog may override it per project rules (warning `billable_overridden`).
        billable_hours:
          type: number
          minimum: 0
          description: Only where the tenant lets billable time be edited.
        comment:
          type:
          - string
          - 'null'
          description: Required when the tenant requires comments.
        calendar_event:
          description: The calendar event this time registers (PD-039). Create-only. Its `employee` must equal the entry's.
          oneOf:
          - $ref: '#/components/schemas/CalendarEventRef'
          - type: 'null'
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
      additionalProperties: false
    TimeEntryUpsert:
      type: object
      description: Body of `PUT /v1/time-entries/ext:{ns}:{key}`. The path key is the external id; on update `employee` and
        `calendar_event` must be unchanged.
      required:
      - employee
      - task
      - date
      - hours
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        task:
          $ref: '#/components/schemas/TaskRef'
        date:
          type: string
          format: date
        hours:
          type: number
          exclusiveMinimum: 0
        billable:
          type: boolean
        billable_hours:
          type: number
          minimum: 0
        comment:
          type:
          - string
          - 'null'
        calendar_event:
          oneOf:
          - $ref: '#/components/schemas/CalendarEventRef'
          - type: 'null'
      additionalProperties: false
    TimeEntry:
      type: object
      description: Hours an employee worked on a task, with three independent status facets (approval, lock, invoicing) and
        an eventually consistent money facet visible only with `costs:read`.
      required:
      - id
      - employee
      - date
      - hours
      - task
      - project
      - allocation
      - legal_entity
      - billable
      - billable_hours
      - comment
      - approval_status
      - approval_stage
      - locked
      - lock_reasons
      - invoice_status
      - invoice
      - calendar_event
      - external_id
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/TimeEntryId'
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        date:
          type: string
          format: date
        hours:
          type: number
        task:
          $ref: '#/components/schemas/TaskRef'
        project:
          $ref: '#/components/schemas/ProjectRef'
          description: Derived from the task.
        allocation:
          $ref: '#/components/schemas/AllocationRef'
          description: Created implicitly when missing (PD-025).
        legal_entity:
          $ref: '#/components/schemas/LegalEntityRef'
        billable:
          type: boolean
        billable_hours:
          type: number
        comment:
          type:
          - string
          - 'null'
        approval_status:
          type: string
          description: Open enum; treat an unknown value as `submitted` (in progress). Stages provisional on PD-023/PD-004.
          x-extensible-enum:
          - not_submitted
          - submitted
          - approved
          - rejected
        approval_stage:
          type:
          - string
          - 'null'
          description: Open enum; ignore an unknown value.
          x-extensible-enum:
          - employee_manager
          - project_manager
        locked:
          type: boolean
        lock_reasons:
          type: array
          description: Open enum items; treat an unknown reason as locked.
          items:
            type: string
            x-extensible-enum:
            - timesheet_closed
            - invoiced
            - period_closed
        invoice_status:
          type: string
          description: Open enum; treat an unknown value as invoiced (do not change).
          x-extensible-enum:
          - not_invoiced
          - on_voucher
          - on_invoice
        invoice:
          oneOf:
          - $ref: '#/components/schemas/InvoiceRef'
          - type: 'null'
        sales_rate:
          description: Sales price per hour (PD-026, PD-012). `null` until the post-commit financial write lands.
          x-required-scope: costs:read
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        rate:
          description: The contract rate that priced the entry.
          x-required-scope: costs:read
          oneOf:
          - $ref: '#/components/schemas/ContractRateRef'
          - type: 'null'
        amount:
          description: Sales value of the entry.
          x-required-scope: costs:read
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        cost:
          description: Cost value of the entry.
          x-required-scope: costs:read
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        financials_updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the money facet last changed (separate watermark, PD-026; ED-029).
          x-required-scope: costs:read
          x-open-decision:
          - ED-029
        calendar_event:
          description: The calendar event this entry registers (PD-039). Survives deletion of the event as a dangling reference
            (PD-057).
          oneOf:
          - $ref: '#/components/schemas/CalendarEventRef'
          - type: 'null'
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
        created_at:
          type: string
          format: date-time
          description: Creation instant. Exposure gated on APG-201 (the stored value is overwritten on update today).
          x-open-decision:
          - APG-201
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
    TimeEntryWriteResult:
      description: A time entry plus the non-fatal outcomes of the write (P8 warnings), e.g. `allocation_created`, `billable_overridden`.
      allOf:
      - $ref: '#/components/schemas/TimeEntry'
      - type: object
        required:
        - warnings
        properties:
          warnings:
            type: array
            items:
              $ref: '#/components/schemas/Warning'
    Booking:
      type: object
      description: One source's share of an employee's planned hours on a task on one day. Firm bookings only (tentative vs
        confirmed is FUTURE, CAP-363). No history.
      required:
      - id
      - employee
      - task
      - allocation
      - project
      - date
      - hours
      - source
      - calendar_event
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/BookingId'
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        task:
          $ref: '#/components/schemas/TaskRef'
        allocation:
          $ref: '#/components/schemas/AllocationRef'
          description: Derived from (employee, task).
        project:
          $ref: '#/components/schemas/ProjectRef'
          description: Derived from the task.
        date:
          type: string
          format: date
        hours:
          type: number
          minimum: 0
          description: This source's hours on this day. `0` = a zeroed share (still readable for the published window, PD-052).
        source:
          $ref: '#/components/schemas/NamespaceToken'
          description: Who owns this share. `timelog` = written inside TimeLog (planner, recurring plans); readable, never
            writable via /v1.
        calendar_event:
          description: The calendar event the share was set from, where TimeLog knows it; otherwise `null`.
          oneOf:
          - $ref: '#/components/schemas/CalendarEventRef'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BookingList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        meta:
          $ref: '#/components/schemas/ListMeta'
    BookingShareSet:
      type: object
      description: Body of `PUT /v1/bookings/by-day`. The coordinate (employee, task, date, source) is the key.
      required:
      - employee
      - task
      - date
      - source
      - hours
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        task:
          $ref: '#/components/schemas/TaskRef'
        date:
          type: string
          format: date
          description: Business date of the share.
        source:
          $ref: '#/components/schemas/NamespaceToken'
          description: Your source namespace. `timelog` is reserved (`422 rule_violation`).
        hours:
          type: number
          minimum: 0
          description: Desired total for your source on this day (not a delta). `0` zeroes the share. Upper bound pending
            trace (APG-325).
          x-open-decision:
          - APG-325
      additionalProperties: false
    RegistrationTargetUnavailableContext:
      type: object
      required:
      - target
      - reason
      properties:
        target:
          $ref: '#/components/schemas/TypedRef'
        reason:
          type: string
          description: Open enum; treat an unknown reason as "choose another target".
          x-extensible-enum:
          - task_not_in_progress
          - not_a_leaf_task
          - project_inactive
          - project_closed_for_time
          - allocation_completed
          - rate_inactive
          - outside_employment
          - not_in_resource_group
    AllocatedHoursExceededContext:
      type: object
      required:
      - allocation
      - allocated_hours
      - registered_hours
      properties:
        allocation:
          $ref: '#/components/schemas/AllocationRef'
        allocated_hours:
          type: number
        registered_hours:
          type: number
    AllocationRequiredContext:
      type: object
      required:
      - employee
      - task
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        task:
          $ref: '#/components/schemas/TaskRef'
    CalendarEventId:
      type: string
      description: Calendar event id. Opaque. Prefix `cev_` is a registry proposal not yet in MAP §6 (TARGET_API_MODEL §2.3).
      pattern: ^cev_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 30
      x-open-decision:
      - ED-003
      - ED-008
      examples:
      - cev_01JB7Q4ZK3M8T5V2W9X6Y0CEV1
    TimeEntryId:
      type: string
      description: Time entry id. Opaque. Prefix `te_` ratified (FP-6); ULID minting ED-003.
      pattern: ^te_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 29
      x-open-decision:
      - ED-003
      examples:
      - te_01JB7Q4ZK3M8T5V2W9X6Y0TE01
    BookingId:
      type: string
      description: Booking share id. Read-only (PD-017). Prefix `bkg_` is a registry proposal; the source header has no GUID,
        so the id is minted or computed (ED-036).
      pattern: ^bkg_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 30
      x-open-decision:
      - ED-036
      - ED-003
      examples:
      - bkg_01JB7Q4ZK3M8T5V2W9X6Y0BKG1
    EmployeeId:
      type: string
