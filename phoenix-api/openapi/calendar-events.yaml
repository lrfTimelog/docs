      x-effects:
        effect: read
        idempotent: true
        idempotency: natural
      security:
      - bearerAuth:
        - planning:read
      parameters:
      - name: id
        in: path
        required: true
        description: The booking share id (`bkg_…`). Not pattern-checked so that any other prefix returns `404 not_found`
          (P3 §2 rule 3).
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: bkg_01JB7Q4ZK3M8T5V2W9X6Y0BKG1
