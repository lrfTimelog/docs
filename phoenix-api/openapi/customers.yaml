                    created_at: '2026-09-02T12:00:00Z'
                    updated_at: '2026-10-01T10:02:31Z'
                    deleted_at: null
                    warnings: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CustomersForbidden'
