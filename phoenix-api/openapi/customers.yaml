  schemas:
    Customer:
      type: object
      description: 'A party the tenant sells to, buys from or prospects. One record per party; its role is `relationship`.
        Row scope: the bound employee''s customer privileges (all customers, or those where they are account manager).'
      required:
      - id
      - name
      - number
      - relationship
      - customer_status
      - status
      - currency
      - vat_number
      - address
      - account_manager
      - merged_into
      - invoicing
      - external_id
      - managed_by
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/CustomerId'
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Company name.
        number:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Business number. With an active number series TimeLog assigns it; otherwise the client sets it on create.
            Create-only. Unique per tenant once ED-035 adds the constraint (PD-031); until then treat it as a lookup aid.
          x-open-decision:
          - ED-035
        relationship:
          type: array
          readOnly: true
          description: 'Derived from the status label: `customer`, `supplier`, `lead`; empty when the label implies none.
            Change it by changing `customer_status`. Fallback for an unknown value - ignore it.'
          items:
            type: string
            x-extensible-enum:
            - customer
            - supplier
            - lead
        customer_status:
          allOf:
          - $ref: '#/components/schemas/CustomerStatusRef'
          description: The tenant's status label (`GET /v1/customer-statuses`). Required on create; TimeLog has no default.
        status:
          type: string
          readOnly: true
          description: '`active` or `inactive`, derived from the label. Fallback for an unknown value: treat as `inactive`.'
          x-extensible-enum:
          - active
          - inactive
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 code. Defaults to the tenant's base currency.
        vat_number:
          type:
          - string
          - 'null'
          maxLength: 50
          description: VAT or company registration number, as entered.
        address:
          description: Postal address. `null` when none is recorded.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Address'
        account_manager:
          description: The employee responsible for the customer (`emp_`, PD-038), or `null`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmployeeRef'
        merged_into:
          readOnly: true
          description: Survivor this customer was marked as merged into (`:mark-merged`, PD-046), or `null`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CustomerRef'
          x-open-decision:
          - ED-050
        invoicing:
          $ref: '#/components/schemas/CustomerInvoicing'
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
        managed_by:
          $ref: '#/components/schemas/ManagedBy'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: 'null'
          readOnly: true
          description: Always `null` on a live customer. A deleted customer is returned as a `Tombstone` (P5 §3), never as
            a full body.
    CustomerCompact:
      type: object
      description: Default list projection (P4 §4). `fields=` adds any field of `Customer`.
      required:
      - id
      - name
      - number
      - relationship
      - status
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/CustomerId'
        name:
          type: string
        number:
          type:
          - string
          - 'null'
        relationship:
          type: array
          items:
            type: string
            x-extensible-enum:
            - customer
            - supplier
            - lead
        status:
          type: string
          x-extensible-enum:
          - active
          - inactive
        updated_at:
          type: string
          format: date-time
    CustomerList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerCompact'
        meta:
          $ref: '#/components/schemas/ListMeta'
    Address:
      type: object
      description: Postal address. Storage mapping of the street lines is `[i]` (A1 §5); see ENGINEERING-REVIEW.md.
      properties:
        street:
          type:
          - string
          - 'null'
          maxLength: 255
        postal_code:
          type:
          - string
          - 'null'
          maxLength: 20
        city:
          type:
          - string
          - 'null'
          maxLength: 100
        country:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2.
    CustomerInvoicing:
      type: object
      description: Invoice settings embedded from the customer's invoice-settings row (C-01; APG-103 closed). Copied to new
        projects.
      required:
      - payment_term
      - calculate_vat
      - vat_rate
      properties:
        payment_term:
          description: Default payment term (`ptm_`), or `null`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PaymentTermRef'
        calculate_vat:
          type: boolean
          description: Whether VAT is added on invoices to this customer.
        vat_rate:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]+)?$
          description: VAT percentage as a decimal string.
    CustomerCreate:
      type: object
      required:
      - name
      - customer_status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        number:
          type: string
          minLength: 1
          maxLength: 50
          description: Only when the tenant has no active customer number series (PD-031).
        customer_status:
          $ref: '#/components/schemas/CustomerStatusRef'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        vat_number:
          type:
          - string
          - 'null'
          maxLength: 50
        address:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Address'
        account_manager:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmployeeRef'
        invoicing:
          $ref: '#/components/schemas/CustomerInvoicingWrite'
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
    CustomerUpsert:
      description: Full writable representation for `PUT ext:`. On the create branch it behaves as `CustomerCreate` and the
        path's key is added to `external_id`; on the update branch omitted optional fields are reset to their defaults and
        `number` is create-only.
      allOf:
      - $ref: '#/components/schemas/CustomerCreate'
    CustomerPatch:
      type: object
      minProperties: 1
      description: Send only the fields to change. `null` clears a nullable field.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        customer_status:
          $ref: '#/components/schemas/CustomerStatusRef'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        vat_number:
          type:
          - string
          - 'null'
          maxLength: 50
        address:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Address'
        account_manager:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmployeeRef'
        invoicing:
          $ref: '#/components/schemas/CustomerInvoicingWrite'
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
    CustomerInvoicingWrite:
      type: object
      properties:
        payment_term:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PaymentTermRef'
        calculate_vat:
          type: boolean
        vat_rate:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+(\.[0-9]+)?$
    CustomerWriteResult:
      description: The customer after the write, plus non-fatal `warnings[]` (e.g. `managed_by_upstream`).
      allOf:
      - $ref: '#/components/schemas/Customer'
      - type: object
        required:
        - warnings
        properties:
          warnings:
            type: array
            items:
              $ref: '#/components/schemas/Warning'
    CustomerMarkMerged:
      type: object
      required:
      - into
      - customer_status
      properties:
        into:
          $ref: '#/components/schemas/CustomerRef'
        customer_status:
          $ref: '#/components/schemas/CustomerStatusRef'
    CustomerEvent:
      description: Thin event about a customer (FP-2 envelope). `object.type` is `customer`.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            type: string
            pattern: ^customer\.[a-z_]+$
          object:
            type: object
            properties:
              type:
                const: customer
              id:
                $ref: '#/components/schemas/CustomerId'
    CustomerStatus:
      type: object
      required:
      - id
      - name
      - relationship
      - status
      - is_default
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/CustomerStatusId'
        name:
          type: string
        relationship:
          type: array
          description: Roles a customer with this label has. Empty for a label that implies none.
          items:
            type: string
            x-extensible-enum:
            - customer
            - supplier
            - lead
        status:
          type: string
          x-extensible-enum:
          - active
          - inactive
          description: Whether the label is active.
        is_default:
          type: boolean
          description: The label the TimeLog UI preselects. The API never applies it implicitly.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomerStatusList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerStatus'
        meta:
          $ref: '#/components/schemas/ListMeta'
    CalendarEventId:
      type: string
      description: Calendar event id. Opaque. Prefix `cev_` is a registry proposal not yet in MAP §6 (TARGET_API_MODEL §2.3).
