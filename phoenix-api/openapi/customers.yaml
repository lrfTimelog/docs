  /v1/customers/{id}:mark-merged:
    post:
      operationId: markCustomerMerged
      tags:
      - Customers
      summary: Mark a customer as merged into a survivor
      description: 'Use after your CRM or ERP merged two parties that both exist in TimeLog (SC-05). Sets the read-only `merged_into`
        on this customer (the loser) and moves it to the inactive label you name. Nothing else moves: projects, invoices and
        history stay on the loser, and your keys move separately with `POST /v1/links/{id}:move` (D11). This is the documented
        workaround of PD-046 (a), not a product merge. Preconditions: `into` exists, is not this customer and is not itself
        merged (`422 rule_violation`, `rule: merge_target_invalid`); `customer_status` is an inactive label. Repeating the
        call with the same `into` is a no-op `200`. Emits `customer.merged`.'
      x-requirements:
      - CAP-109
      - SC-05
      x-effects:
        effect: destructive
        idempotent: true
        idempotency: key_optional
      x-open-decision:
      - ED-050
      - APG-601
      - PD-059
      security:
      - bearerAuth:
        - customers:write
      parameters:
      - $ref: '#/components/parameters/CustomerPathId'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerMarkMerged'
            examples:
              merge_duplicate:
                summary: Mark the duplicate as merged into the survivor
                value:
                  into:
                    id: cus_01JB7Q4ZK3M8T5V2W9X6Y0CX01
                  customer_status:
                    id: cst_01JB7Q4ZK3M8T5V2W9X6Y0CST3
      responses:
        '200':
          description: The loser after the mark (or unchanged, when it was already merged into the same survivor).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            Request-Id:
              $ref: '#/components/headers/Request-Id'
            RateLimit-Limit:
