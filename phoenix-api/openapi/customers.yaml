        with `PATCH` instead, or by `:mark-merged` after an upstream merge (PD-010). Deleting an already-deleted customer
        returns `204` (FP-4). Emits `customer.deleted`; the tombstone stays readable through `GET` for the retention window
        once deletes are captured (ED-037).
      x-requirements:
      - CAP-106
      - SC-02
      x-effects:
        effect: destructive
        idempotent: true
        idempotency: natural
      x-open-decision:
