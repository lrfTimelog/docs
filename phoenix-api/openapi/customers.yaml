        is `customer.status_changed`) or a merge mark (`customer.merged`). No field list: GET and compare.'
      x-requirements:
      - SC-07
      - SC-13
      - SC-40
      x-open-decision:
      - ED-028
      - ED-049
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEvent'
            examples:
