                  value:
                    id: cus_01JB7Q4ZK3M8T5V2W9X6Y0CX05
                    name: Example Engineering
                    number: '10088'
                    relationship: []
                    customer_status:
                      id: cst_01JB7Q4ZK3M8T5V2W9X6Y0CST3
                    status: inactive
                    currency: DKK
                    vat_number: DK12345678
                    address: null
                    account_manager: null
                    merged_into:
                      id: cus_01JB7Q4ZK3M8T5V2W9X6Y0CX01
                    invoicing:
                      payment_term: null
                      calculate_vat: true
                      vat_rate: '25.00'
                    external_id:
