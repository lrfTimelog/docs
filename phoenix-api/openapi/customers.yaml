                value:
                  id: evt_01JB7Q4ZK3M8T5V2W9X6Y0EV13
                  type: customer.status_changed
                  occurred_at: '2026-10-01T09:45:10Z'
                  api_version: null
                  tenant_id: ten_01JB7Q4ZK3M8T5V2W9X6Y0TEN1
                  object:
                    type: customer
                    id: cus_01JB7Q4ZK3M8T5V2W9X6Y0CX04
                  related: []
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.
  customer.merged:
