webhooks:
  customer.created:
    post:
      operationId: onCustomerCreated
      summary: A customer, supplier or lead now exists
      description: Emitted after commit for creates through `/v1` and the TimeLog manager paths. Some legacy write paths do
        not emit yet (ED-049, ED-028); see the README. `related[]` carries the account manager when set.
      x-requirements:
      - SC-07
      - SC-40
      x-open-decision:
      - ED-028
      - ED-049
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEvent'
            examples:
              created:
                value:
                  id: evt_01JB7Q4ZK3M8T5V2W9X6Y0EV11
                  type: customer.created
                  occurred_at: '2026-10-01T09:30:01Z'
                  api_version: null
                  tenant_id: ten_01JB7Q4ZK3M8T5V2W9X6Y0TEN1
                  object:
                    type: customer
                    id: cus_01JB7Q4ZK3M8T5V2W9X6Y0CX01
                  related:
                  - type: employee
                    id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.
  customer.updated:
    post:
      operationId: onCustomerUpdated
