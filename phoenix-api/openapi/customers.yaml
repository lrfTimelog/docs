          description: '`credential`, `tenant` or `tier:<name>`.'
        retry_after_seconds:
          type: integer
          minimum: 0
        quota:
          type: string
        resets_at:
          type: string
          format: date-time
    DependencyUnavailableContext:
      type: object
      required:
      - capability
      - outcome
      properties:
        capability:
          type: string
          description: Public capability name, never an internal service name.
          x-extensible-enum:
          - time_registration
          - resource_planning
          - exports
        outcome:
          type: string
          x-extensible-enum:
          - not_applied
          - unknown
    EventEnvelope:
      type: object
      description: Thin event envelope. No `sequence` (FP-5 (4)); `api_version` is always `null`. Delivered at least once,
        after commit, unordered; dedupe on `id` and `GET` the object for current state. Unknown types and fields must be ignored.
        `related[]` entries the subscriber cannot read are removed (P10 §5). `snapshot` only when the subscription opted in
        (`include_snapshot`).
      required:
      - id
      - type
      - occurred_at
      - api_version
      - tenant_id
      - object
      - related
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
          examples:
          - time_entry.created
        occurred_at:
          type: string
          format: date-time
        api_version:
          type: 'null'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        object:
          $ref: '#/components/schemas/TypedRef'
        related:
          type: array
          items:
            $ref: '#/components/schemas/TypedRef'
        snapshot:
          type: object
          additionalProperties: true
      examples:
      - id: evt_01JB7Q4ZK3M8T5V2W9X6Y0EVT1
        type: time_entry.created
        occurred_at: '2026-09-03T10:05:12Z'
        api_version: null
        tenant_id: ten_01JB7Q4ZK3M8T5V2W9X6Y0TEN1
        object:
          type: time_entry
          id: te_01JB7Q4ZK3M8T5V2W9X6Y0TE01
        related:
        - type: employee
          id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
        - type: calendar_event
          id: cev_01JB7Q4ZK3M8T5V2W9X6Y0CEV1
    XEffects:
      type: object
      required:
      - effect
      - idempotent
      properties:
        effect:
          type: string
          enum:
          - read
          - write
          - destructive
        idempotent:
          type: boolean
        idempotency:
          type: string
          enum:
          - natural
          - key_required
          - key_optional
      additionalProperties: false
  headers:
    Request-Id:
      description: Unique id of this request. Same value as `request_id` in a problem body (P8). Quote it to support.
      schema:
        type: string
        maxLength: 64
      example: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ1
    RateLimit-Limit:
      description: Requests allowed in the current window of the bucket this request consumed (P9 §1). Numbers are published
        per caller type (PD-053 uniform at v1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    RateLimit-Remaining:
      description: Requests left in the current window of the consumed bucket (P9 §1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    RateLimit-Reset:
      description: Seconds until the consumed bucket's window resets (P9 §1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    Retry-After:
      description: Seconds to wait before retrying (`429`, and `503` when known) (P8 classes 9-11, P9).
      schema:
        type: integer
        minimum: 0
    ETag:
      description: Entity tag of the returned resource; changes whenever `updated_at` changes (P5 §5). Send it back in `If-Match`
        to write only if nothing changed (P6 §3). The backing signal per resource is ED-038.
      schema:
        type: string
      x-open-decision:
      - ED-038
    Location:
      description: URL of the created resource (`201`).
      schema:
        type: string
        format: uri-reference
    Idempotent-Replayed:
      description: '`true` when this response is the stored outcome of an earlier request with the same `Idempotency-Key`
        and body (P6 §1). Nothing was created or emitted.'
      schema:
        type: boolean
