                value:
                  id: evt_01JB7Q4ZK3M8T5V2W9X6Y0EV12
                  type: customer.updated
                  occurred_at: '2026-10-01T09:40:00Z'
                  api_version: null
                  tenant_id: ten_01JB7Q4ZK3M8T5V2W9X6Y0TEN1
                  object:
                    type: customer
                    id: cus_01JB7Q4ZK3M8T5V2W9X6Y0CX01
                  related:
                  - type: employee
                    id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.
  customer.status_changed:
    post:
      operationId: onCustomerStatusChanged
      summary: The customer's status label changed
      description: Includes lead → customer conversion; `relationship` follows the label. GET the customer for the new label.
      x-requirements:
      - SC-40
      x-open-decision:
      - ED-028
      - ED-049
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEvent'
            examples:
