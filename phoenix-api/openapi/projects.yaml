components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer credential of a service account bound to an `api_user` employee (D-007) or a personal access token
        (P2 §A). The tenant comes from the credential only. Effective permission = scope ∩ privilege ∩ licence ∩ row scope
        (P2 §B). Security requirements list the required `<family>:<access>` scopes as role names (OpenAPI 3.1 §4.8.30). Token
        mechanism: service accounts ED-019, PATs on the public host ED-004.'
      x-open-decision:
      - ED-019
      - ED-004
      x-scopes:
        time:read: Read time entries, timesheets and calendar events.
        time:write: Create and change time entries.
        planning:read: Read allocations, bookings and capacity views.
        planning:write: Set booking shares and change allocations.
        costs:read: Sensitive (PD-012). Cost and revenue fields; omitted from bodies when absent.
        customers:read: Read customers, their status labels and (when shipped) contacts.
        customers:write: Create, change, merge-mark and delete customers.
        projects:read: Read projects, project templates and project reference lists (types, categories, stages).
        projects:write: Create projects (blank or from a template), change them, move them through their lifecycle and delete
          them.
  parameters:
    ProjectPathId:
      name: id
      in: path
      required: true
      description: The project id (`prj_…`). Deliberately not pattern-checked, so any other prefix is `404 not_found`, never
        `400` (P3 §2 rule 3).
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: prj_01JB7Q4ZK3M8T5V2W9X6Y0PRJ1
    Namespace:
      name: ns
      in: path
      required: true
      description: Your namespace token (`[a-z0-9-]`, 1-32 chars, stable once used), e.g. `crm-deal` or `erp`.
      schema:
        $ref: '#/components/schemas/NamespaceToken'
      example: erp
    ExternalKey:
      name: key
      in: path
      required: true
      description: Your key within the namespace (URL-encoded).
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: SO-55120
    ProjectExpand:
      name: expand
      in: query
      description: Replace these references in place with the full object (one level, P4 §5).
      style: form
      explode: false
      schema:
        type: array
        maxItems: 5
        items:
          type: string
          enum:
          - customer
          - project_manager
          - default_contract
          - stage
          - legal_entity
    ReferenceStatus:
      name: status
      in: query
      description: Only active or only inactive entries.
      schema:
        type: string
        x-extensible-enum:
        - active
        - inactive
      example: active
    ReferenceSort:
      name: sort
      in: query
      description: One sort key, `-` for descending; implicit `id` tiebreak (P4 §3).
      schema:
        type: string
        enum:
        - created_at
        - -created_at
        - updated_at
        - -updated_at
        - name
        - -name
        default: name
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, maximum 100 (P4 §1 starting values). Above the maximum is `400 malformed_request`,
        never silently clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `meta.next_cursor` from the previous page (P4 §1). Send it with no other parameter changed, or the
        response is `400 invalid_cursor`. Cursor lifetime is a published service window (PD-052); an expired cursor is `400
        invalid_cursor`.
      schema:
        type: string
        maxLength: 2048
      x-open-decision:
      - PD-052
      - ED-011
    Fields:
      name: fields
      in: query
      required: false
      description: Comma-separated top-level fields to return (`id` always included); dotted paths select inside an expanded
        reference (P4 §4).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)?$
        maxItems: 50
    IdFilter:
      name: id
      in: query
      required: false
      description: Only these ids (`in`, comma-separated, max 100) (P4 §2 global set).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        maxItems: 100
    CreatedAfter:
      name: created_after
      in: query
      required: false
      description: Only rows created strictly after this instant (P4 §2 global set).
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      required: false
      description: Only rows created at or before this instant (P4 §2 global set).
      schema:
        type: string
        format: date-time
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      description: '`true` adds soft-deleted rows (tombstones) within the retention window (FP-4, P5 §3). Resources whose
        delete strategy is snapshot-only return no tombstones; their reference page says so.'
      schema:
        type: boolean
        default: false
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated key (≤ 255 chars, UUID recommended) making this write safe to retry (P6 §1). Required
        here because a duplicate costs money, pay or approval. Same key + same body → original outcome replayed with `Idempotent-Replayed:
        true`; same key + different body → `409 idempotency_key_reused`; still in flight → `409 idempotency_request_in_progress`.
        Missing → `400 validation_failed` (`pointer: header:Idempotency-Key`). Key retention is a published service window
        with a floor of 24 h (PD-052).'
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 6f1c2b9e-3a47-4d0c-9a51-2f8e7d1c4b10
      x-open-decision:
      - PD-052
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional, recommended on retries (P6 §1). Same replay semantics as where it is required. Retention per
        PD-052.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 0b8d4f3a-91e2-4c67-8f1d-5a2c3e9b7d64
      x-open-decision:
      - PD-052
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Write only if the resource's current `ETag` equals this value; otherwise `412 precondition_failed` and
        nothing is written (P6 §3). Optional; omitting it is last-write-wins.
      schema:
        type: string
    DryRun:
      name: dry_run
      in: query
      required: false
      description: '`true` runs the same authorization, validation and business rules and returns what the real call would
        return (status, body with a placeholder id, `warnings[]`, or the same error) with no side effects: nothing stored,
        no events, no id reserved, no idempotency record (P6 §5).'
      schema:
        type: boolean
        default: false
    Q:
      name: q
      in: query
      required: false
      description: 'Free-text search over the resource''s declared search fields (its reference page lists them), case- and
        accent-insensitive, minimum 2 characters (P4 §6). Deterministic ranking: exact business-key match (number, external
        key, email) first, then name prefix, then contained term; ties by `id`. `sort` is ignored when `q` is present. Search
        obeys row scope. If an index serves it, `meta.as_of` reflects the index''s freshness.'
      schema:
        type: string
        minLength: 2
        maxLength: 200
      x-open-decision:
      - ED-040
  requestBodies:
    LifecycleAction:
      required: false
      description: Optional. Without a body the move is recorded for today.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectLifecycleAction'
          examples:
            with_date:
              summary: Record the move on a given date
              value:
                status_date: '2026-10-01'
            empty:
