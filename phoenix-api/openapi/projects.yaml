      type: object
      description: Polymorphic reference (P3 §2 rule 4). `type` is the snake_case object type, never a storage type code.
      required:
      - type
      - id
      properties:
        type:
          type: string
          examples:
          - time_entry
        id:
          type: string
    ExternalIdMap:
      type: object
      description: 'Namespaced external keys (FP-6): namespace → key. Several systems may each hold their own key on one record.
        Unique per (tenant, resource type, namespace). Namespace token `[a-z0-9-]{1,32}`, stable once used (P3 §3). Who may
        write a namespace: any credential with the write scope, audited (PD-051 (c)).'
      propertyNames:
        pattern: ^[a-z0-9-]{1,32}$
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 255
      examples:
      - cadac: evt-2026-0903-0900-a17
    NamespaceToken:
      type: string
      description: Namespace token, same grammar as `external_id` namespaces (P3 §3).
      pattern: ^[a-z0-9-]{1,32}$
    ManagedBy:
      type:
      - object
      - 'null'
      description: Advisory system of record (P3 §8, PD-022 (b)). Set when a tenant admin declared an upstream system (by
        its `external_id` namespace) as owner of this resource type, optionally for a list of fields (empty = all writable
        fields). Writes to managed fields still succeed and return the warning `managed_by_upstream`. Read-only. `null` when
        no system of record is declared.
      required:
      - namespace
      - fields
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceToken'
        fields:
          type: array
          items:
            type: string
      examples:
      - namespace: crm
        fields:
        - name
        - account_manager
    Money:
      type: object
      description: Money (P3 §5). `amount` is a decimal string so no precision is lost; `currency` is ISO 4217.
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          examples:
          - '1250.00'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          examples:
          - DKK
    ListMeta:
      type: object
      required:
      - next_cursor
      - has_more
      - tenant_id
      - as_of
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; `null` on the last page.
        has_more:
          type: boolean
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        as_of:
          type: string
          format: date-time
          description: Server time of the read (APG-610).
    Tombstone:
      type: object
      description: Minimal body of a deleted record returned by `GET /{id}` during the retention window (P5 §3); `404` after
        it. Retention floor ≥ 90 days is published only once backed (FP-4 (b), ED-007).
      required:
      - id
      - deleted_at
      - updated_at
      properties:
        id:
          type: string
        deleted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
      x-open-decision:
      - ED-007
      - ED-037
    Problem:
      type: object
      description: The one error shape for every status ≥ 400 (`application/problem+json`, RFC 9457 + `code`). Switch on `code`;
        an unknown `code` falls back to the class of `status`. Unknown fields must be tolerated.
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      - retryable
      properties:
        type:
          type: string
          format: uri-reference
          description: URI of the code's documentation page (one per `code`). Documentation host is open.
          x-open-decision:
          - ED-013
          - ED-006
        title:
          type: string
          description: Short stable summary of the code.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable machine token. Open catalogue (new codes may be added within /v1).
        detail:
          type: string
          description: Request-specific, remedy-first English sentence. Never internal names or TLP error numbers.
        request_id:
          type: string
          description: Same value as the `Request-Id` header.
        retryable:
          type: boolean
          description: '`true` only when the same request may succeed later unchanged (writes: same `Idempotency-Key`).'
        errors:
          type: array
          description: Field-level problems (400 / 422 only), all returned together (P6 §4).
          items:
            $ref: '#/components/schemas/FieldError'
        context:
          type: object
          description: Typed object whose schema is fixed per `code` (see the `*Context` schemas).
          additionalProperties: true
    FieldError:
      type: object
      required:
      - pointer
      - code
      - message
      properties:
        pointer:
          type: string
          description: JSON Pointer into the body, or `query:<param>`, or `header:<name>`.
        code:
          type: string
          description: Field-level code.
          x-extensible-enum:
          - required
          - invalid_format
          - out_of_range
          - unknown_reference
          - read_only
          - create_only
          - too_long
          - not_allowed_value
        message:
          type: string
        constraint:
          type: object
          additionalProperties: true
    Warning:
      type: object
      description: Non-fatal outcome on a `2xx` (P8). Same catalogue rules as error codes.
      required:
      - code
      - detail
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        detail:
          type: string
        context:
          type: object
          additionalProperties: true
    MissingScopeContext:
      type: object
      required:
      - required_scopes
      properties:
        required_scopes:
          type: array
          items:
            type: string
    LicenceRequiredContext:
      type: object
      required:
      - module
      properties:
        module:
          type: string
          description: Public module name.
          x-extensible-enum:
          - outlook
          - resource_planning
          - crm
          - contract_model
    NotFoundContext:
      type: object
      properties:
        resource_type:
          type: string
        id:
          type: string
        external_ref:
          type: string
    DuplicateContext:
      type: object
      required:
      - matched_on
      - conflicting_resource
      properties:
        matched_on:
          type: string
          description: What collided. Fallback for an unknown value - treat as a generic duplicate and read `conflicting_resource`.
          x-extensible-enum:
          - external_id
          - number
          - natural_key
          - idempotency
          - calendar_event
        namespace:
          $ref: '#/components/schemas/NamespaceToken'
        conflicting_resource:
          $ref: '#/components/schemas/TypedRef'
    PeriodLockedContext:
      type: object
      required:
      - lock_kind
      - period
      properties:
        lock_kind:
          type: string
          x-extensible-enum:
          - registration
          - invoicing
          - approval
        period:
          type: object
          required:
          - start
          - end
          properties:
            id:
              type: string
              description: '`acp_` accounting period id where one exists (D5).'
            start:
              type: string
              format: date
            end:
              type: string
              format: date
    ResourceImmutableContext:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          x-extensible-enum:
          - timesheet_closed
          - invoiced
          - closed_period
          - booked_invoice
          - settled_time
    RuleViolationContext:
      type: object
      required:
      - rule
      properties:
        rule:
          type: string
          description: Stable rule token (catalogued per resource).
    InvalidStateTransitionContext:
      type: object
      description: P8 class 7. `allowed_actions` lists the action names (without the colon) valid from `current_state`.
      required:
      - current_state
      - attempted_action
      - allowed_actions
      properties:
        current_state:
          type: string
        attempted_action:
          type: string
        allowed_actions:
          type: array
          items:
            type: string
    HasDependentsContext:
      type: object
      description: P8 class 8. Object types (snake_case) whose records still reference the one being deleted.
      required:
      - dependent_types
      properties:
        dependent_types:
          type: array
          minItems: 1
          items:
            type: string
    ManagedByUpstreamContext:
      type: object
      description: Context of the `managed_by_upstream` warning (P3 §8). The write succeeded.
      required:
      - namespace
      - fields
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceToken'
        fields:
          type: array
          items:
            type: string
    PreconditionFailedContext:
      type: object
      required:
      - current_etag
      properties:
        current_etag:
          type: string
    RateLimitedContext:
      type: object
      required:
      - limit_scope
      properties:
        limit_scope:
          type: string
          description: '`credential`, `tenant` or `tier:<name>`.'
        retry_after_seconds:
          type: integer
          minimum: 0
        quota:
          type: string
        resets_at:
          type: string
          format: date-time
    DependencyUnavailableContext:
      type: object
      required:
      - capability
      - outcome
      properties:
        capability:
          type: string
          description: Public capability name, never an internal service name.
          x-extensible-enum:
          - time_registration
          - resource_planning
          - exports
        outcome:
          type: string
          x-extensible-enum:
          - not_applied
          - unknown
    EventEnvelope:
      type: object
      description: Thin event envelope. No `sequence` (FP-5 (4)); `api_version` is always `null`. Delivered at least once,
        after commit, unordered; dedupe on `id` and `GET` the object for current state. Unknown types and fields must be ignored.
        `related[]` entries the subscriber cannot read are removed (P10 §5). `snapshot` only when the subscription opted in
        (`include_snapshot`).
      required:
      - id
      - type
      - occurred_at
      - api_version
      - tenant_id
      - object
      - related
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
          examples:
          - time_entry.created
        occurred_at:
          type: string
          format: date-time
        api_version:
          type: 'null'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        object:
          $ref: '#/components/schemas/TypedRef'
        related:
          type: array
          items:
            $ref: '#/components/schemas/TypedRef'
        snapshot:
          type: object
          additionalProperties: true
      examples:
      - id: evt_01JB7Q4ZK3M8T5V2W9X6Y0EVT1
        type: time_entry.created
        occurred_at: '2026-09-03T10:05:12Z'
        api_version: null
        tenant_id: ten_01JB7Q4ZK3M8T5V2W9X6Y0TEN1
        object:
          type: time_entry
          id: te_01JB7Q4ZK3M8T5V2W9X6Y0TE01
        related:
        - type: employee
          id: emp_01JB7Q4ZK3M8T5V2W9X6Y0EMP1
        - type: calendar_event
          id: cev_01JB7Q4ZK3M8T5V2W9X6Y0CEV1
    XEffects:
      type: object
      required:
      - effect
      - idempotent
      properties:
        effect:
          type: string
          enum:
          - read
          - write
          - destructive
        idempotent:
          type: boolean
        idempotency:
          type: string
          enum:
          - natural
          - key_required
          - key_optional
      additionalProperties: false
  headers:
    Request-Id:
      description: Unique id of this request. Same value as `request_id` in a problem body (P8). Quote it to support.
      schema:
        type: string
        maxLength: 64
      example: req_01JB7Q4ZK3M8T5V2W9X6Y0REQ1
    RateLimit-Limit:
      description: Requests allowed in the current window of the bucket this request consumed (P9 §1). Numbers are published
        per caller type (PD-053 uniform at v1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    RateLimit-Remaining:
      description: Requests left in the current window of the consumed bucket (P9 §1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    RateLimit-Reset:
      description: Seconds until the consumed bucket's window resets (P9 §1).
      schema:
        type: integer
        minimum: 0
      x-open-decision:
      - ED-039
    Retry-After:
      description: Seconds to wait before retrying (`429`, and `503` when known) (P8 classes 9-11, P9).
      schema:
        type: integer
        minimum: 0
    ETag:
      description: Entity tag of the returned resource; changes whenever `updated_at` changes (P5 §5). Send it back in `If-Match`
        to write only if nothing changed (P6 §3). The backing signal per resource is ED-038.
      schema:
        type: string
      x-open-decision:
      - ED-038
    Location:
      description: URL of the created resource (`201`).
      schema:
        type: string
        format: uri-reference
    Idempotent-Replayed:
      description: '`true` when this response is the stored outcome of an earlier request with the same `Idempotency-Key`
        and body (P6 §1). Nothing was created or emitted.'
      schema:
        type: boolean
