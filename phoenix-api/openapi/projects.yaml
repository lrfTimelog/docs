    ProjectsForbidden:
      description: 'The credential may not perform this operation (P8 class 2): `missing_scope` (context `required_scopes`)
        or `insufficient_privilege` (the bound employee lacks a project privilege, or may read but not update this project).
        A project outside the row scope is `404`, never `403`.'
      x-error-codes:
      - missing_scope
      - insufficient_privilege
      x-context-by-code:
        missing_scope: ../_shared/components.yaml#/components/schemas/MissingScopeContext
      headers:
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              properties:
                context:
                  $ref: '#/components/schemas/MissingScopeContext'
          examples:
            missing_scope:
              value:
                type: /errors/missing_scope
                title: Missing scope
                status: 403
                code: missing_scope
                detail: This credential lacks the scope 'projects:write'. Ask a tenant admin to add it to the credential.
                request_id: req_01JB7Q4ZK3M8T5V2W9X6Y0P001
                retryable: false
                context:
                  required_scopes:
                  - projects:write
            insufficient_privilege:
