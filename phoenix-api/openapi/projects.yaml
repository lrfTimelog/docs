  schemas:
    Project:
      type: object
      description: 'A delivery unit for one customer. Row scope: the bound employee''s project privileges (all, legal entity,
        department and sub-departments, projects they manage, projects they are account manager of).'
      required:
      - id
      - number
      - name
      - status
      - archived_at
      - customer
      - contact
      - project_manager
      - type
      - category
      - stage
      - department
      - legal_entity
      - currency
      - start_date
      - end_date
      - is_open_for_time_registration
      - is_available_in_resource_planner
      - time_registration_model
      - default_contract
      - budget_hours
      - budget_amount
      - invoicing
      - created_from_template
      - external_id
      - managed_by
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
        number:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Business number. With an active number series TimeLog assigns it; otherwise the client sets it on create.
            Create-only. Unique per tenant once ED-035 adds the constraint (PD-031).
          x-open-decision:
          - ED-035
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          readOnly: true
          description: 'Lifecycle state, changed only by the lifecycle actions. Fallback for an unknown value: treat the project
            as closed for new work and read `is_open_for_time_registration`.'
          x-extensible-enum:
          - quote
          - approved
          - in_progress
          - on_hold
          - completed
          - archived
          - cancelled
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the project was archived (`:archive`); `null` otherwise. Archiving is a status, not a delete (FP-4).
        customer:
          allOf:
          - $ref: '#/components/schemas/CustomerRef'
          description: The customer the project is delivered for. Create-only.
        contact:
          description: Contact person at the customer (`ctc_`), or `null`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ContactRef'
        project_manager:
          allOf:
          - $ref: '#/components/schemas/EmployeeRef'
          description: The responsible employee (`emp_`, PD-038). Becomes the first member of the project's resource group
            on create.
        type:
          $ref: '#/components/schemas/ProjectTypeRef'
        category:
          description: Project category, or `null`. Required on create only where the tenant requires categories.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ProjectCategoryRef'
        stage:
          description: Tenant-defined stage (not the lifecycle status), or `null`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ProjectStageRef'
        department:
          description: Handling department, or `null`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DepartmentRef'
        legal_entity:
          allOf:
          - $ref: '#/components/schemas/LegalEntityRef'
          description: Legal entity that delivers the project. Defaults to the tenant's default legal entity. Create-only.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217. Defaults from the legal entity's price list. Create-only.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          description: On or after `start_date`.
        is_open_for_time_registration:
          type: boolean
          readOnly: true
          description: Whether time can be registered now. Derived from `status` (and, for quote and approved, the tenant
            setting).
        is_available_in_resource_planner:
          type: boolean
        time_registration_model:
          type: string
          description: 'Who may register time: `allocated_only` (allocated employees), `general` (anyone), `department` (the
            department''s employees), `project_members` (members). Fallback for an unknown value: assume `allocated_only`.'
          x-extensible-enum:
          - allocated_only
          - general
          - department
          - project_members
        default_contract:
          readOnly: true
          description: The project's default contract (`ctr_`, D3). Set on create; `null` only on legacy projects without
            one.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ContractRef'
        budget_hours:
          type:
          - number
          - 'null'
          readOnly: true
          description: Budgeted hours across the project's contracts. Budgets are edited on contracts (D3). Roll-up rule `[i]`.
        budget_amount:
          readOnly: true
          description: Budgeted revenue across the project's contracts, in the project currency. A budget, not a cost (no
            `costs:read` needed) `[i]`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Money'
        invoicing:
          $ref: '#/components/schemas/ProjectInvoicing'
        created_from_template:
          readOnly: true
          description: The template the project was created from, or `null`.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ProjectTemplateRef'
        external_id:
          $ref: '#/components/schemas/ExternalIdMap'
        managed_by:
          $ref: '#/components/schemas/ManagedBy'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: 'null'
          readOnly: true
          description: Always `null` on a live project. A deleted project is returned as a `Tombstone` (P5 §3), never as a
            full body.
    ProjectCompact:
      type: object
