          type: boolean
          default: true
        resource_group:
          type: boolean
          default: true
        allocations:
          type: boolean
          default: true
        budgets_and_payments:
          type: boolean
          default: true
          description: '`false`: template contracts are not copied and one default contract is generated (recurrence contracts
            are copied regardless).'
