      summary: Reopen a closed or held project
      description: 'Moves the project to `in_progress` from `on_hold`, `completed`, `archived` or `cancelled` only (from `quote`,
        `approved` or `in_progress` it is `409 invalid_state_transition`). Effects (trace T-107, TimeLog''s own status change,
        so the UI and this action behave identically): the project opens for time registration again. Contracts closed by
        the close are not reopened by this action; reopen them through the contracts API (D3). A completed or cancelled project
        also reopens on its own when one of its contracts becomes open again (emits the same events). Already `in_progress`:
        `409 invalid_state_transition`, with `allowed_actions` listing every other move. Emits `project.status_changed`, `project.reopened`
        and `project.started` after commit. Optional `status_date` (default: today) is the date recorded for the move. Requires
        `projects:write` and the right to update this project. `Idempotency-Key` optional; `If-Match` accepted.'
