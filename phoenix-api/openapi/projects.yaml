      summary: Create a project from a template
      description: 'The CRM won-deal path (SC-03, PD-036). Copies the template''s contracts and their rates and payors, tasks,
        allocations, milestones, instalments, recurrences, resources and products, governed by the five `include` flags (all
        default `true`; `allocations` takes effect only with `tasks_and_milestones` and `resource_group`). With `budgets_and_payments:
        false`, template contracts are not copied and one default contract is generated instead (recurrence contracts are
        copied regardless). A `default_contract` in the body implies `budgets_and_payments: false` with that model and key,
        so the handover ends with exactly one contract you can address by your deal id. Dates keep the template''s duration
        from `start_date` unless `end_date` is given. Requires `projects:write` and the project-create privilege. One atomic
        outcome; `project.created` is emitted only after the copy completes. Replay-safe: send an `Idempotency-Key` derived
        from your deal id; after the key''s retention window, the same `external_id` returns `409 duplicate` with the existing
        project.'
